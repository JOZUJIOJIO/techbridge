  <text x="4" y="88" fill="#F0EFEB" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82" font-weight="750" letter-spacing="-3.2">Qian</text>
  <text x="177" y="88" fill="#F37021" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82" font-weight="750" font-style="italic" letter-spacing="-3.2">X</text>
  <circle cx="239" cy="80" r="7" fill="#F37021"/>
  <text x="251" y="88" fill="#F0EFEB" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="650" letter-spacing="-1.8">ai</text>
</svg>
