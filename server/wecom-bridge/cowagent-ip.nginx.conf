server {
  listen 80;
  listen [::]:80;
  server_name 175.178.75.176;
  client_max_body_size 50m;

  location = /message {
    proxy_pass http://127.0.0.1:8080/message;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /luoyun-admin {
    return 302 /luoyun-admin/;
  }

  location /luoyun-admin/ {
    proxy_pass http://127.0.0.1:8766/luoyun-admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /mate-positioning {
    return 301 /mate-positioning/;
  }

  location ~* ^/mate-positioning/assets/.*\.(png|jpg|jpeg|gif|webp|svg|ico|css|js)$ {
    root /var/www;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /mate-positioning/ {
    root /var/www;
    index index.html;
    try_files $uri $uri.html $uri/ /mate-positioning/index.html;
  }

  location / {
    proxy_pass http://127.0.0.1:9899;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
