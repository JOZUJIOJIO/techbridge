server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name skills.siliconstory.cn;

  ssl_certificate /etc/letsencrypt/live/skills.siliconstory.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/skills.siliconstory.cn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/ai-skills-site/current;
  index skill-letter.html;
  charset utf-8;
  client_max_body_size 2m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  location = / {
    try_files /skill-letter.html =404;
  }

  location = /skills {
    try_files /skill-letter.html =404;
  }

  location = /service-policy {
    try_files /skill-service-policy.html =404;
  }

  location = /skill-service-policy {
    try_files /skill-service-policy.html =404;
  }

  location ~ "^/join/[A-Za-z0-9_-]{24,64}/?$" {
    try_files /distribution-join.html =404;
  }

  location = /earnings {
    try_files /partner-portal.html =404;
  }

  location = /admin/distribution {
    try_files /distribution-admin.html =404;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location ^~ /techbridge/ {
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location ~ "^/p/[a-z0-9][a-z0-9-]{1,62}[a-z0-9]/?$" {
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri.html =404;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name skills.siliconstory.cn;
  return 301 https://$host$request_uri;
}
